{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "identity-platform.fullname" . }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- with .Values.ingress.tls }}
  {{- if .enabled }}
  tls:
    - hosts:
        - {{ $.Values.ingress.host | quote }}
      secretName: {{ .secretName | quote }}
  {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-frontend" (include "identity-platform.fullname" .) }}
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-api-gateway" (include "identity-platform.fullname" .) }}
                port:
                  number: 3000
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-api-gateway" (include "identity-platform.fullname" .) }}
                port:
                  number: 3000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-auth-server" (include "identity-platform.fullname" .) }}
                port:
                  number: 3001
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-auth-server" (include "identity-platform.fullname" .) }}
                port:
                  number: 3001
          - path: /mfa
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-auth-server" (include "identity-platform.fullname" .) }}
                port:
                  number: 3001
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-auth-server" (include "identity-platform.fullname" .) }}
                port:
                  number: 3001
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-auth-server" (include "identity-platform.fullname" .) }}
                port:
                  number: 3001
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-auth-server" (include "identity-platform.fullname" .) }}
                port:
                  number: 3001
{{- end }}