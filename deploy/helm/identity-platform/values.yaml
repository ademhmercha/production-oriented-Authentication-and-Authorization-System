nameOverride: ""

image:
  repository: identity-platform
  tag: local
  pullPolicy: IfNotPresent

# One image, three entrypoints - same split the docker-compose stack uses.
apps:
  auth-server:
    replicaCount: 1
    command: ["node", "dist/apps/auth-server/main.js"]
    port: 3001
    keysVolume: true
    livenessProbe:
      path: /health/live
    readinessProbe:
      path: /health/ready
  api-gateway:
    replicaCount: 1
    command: ["node", "dist/apps/api-gateway/main.js"]
    port: 3000
    keysVolume: false
    livenessProbe:
      path: /healthz
    readinessProbe:
      path: /healthz
  resource-api:
    replicaCount: 1
    command: ["node", "dist/apps/resource-api/main.js"]
    port: 3002
    keysVolume: false
    livenessProbe:
      path: /health
    readinessProbe:
      path: /health

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Bundle Postgres/Redis/MailHog in the chart. Set to false and provide
# serviceUrls.* / databaseUrl to point at managed or external services.
infrastructure:
  enabled: true

postgres:
  image: postgres:16-alpine
  size: 8Gi
  storageClass: ""

redis:
  image: redis:7-alpine
  size: 1Gi
  storageClass: ""

mailhog:
  image: mailhog/mailhog:v1.0.1

keys:
  size: 1Gi
  storageClass: ""

# Service hostnames override when infrastructure is external.
serviceUrls:
  redis: ""
  authServer: ""
  resourceApi: ""
  smtpHost: ""

# Non-secret environment, mirrors docker-compose x-common-env.
env:
  NODE_ENV: production
  LOG_LEVEL: info
  JWT_ISSUER: https://auth.local
  JWT_AUDIENCE: api
  KMS_KEY_DIR: /app/keys
  CORS_ORIGINS: http://localhost:3000,http://localhost:8080
  RATE_LIMIT_REGISTER: "100"
  RATE_LIMIT_LOGIN: "60"
  RATE_LIMIT_TOKEN: "120"
  RATE_LIMIT_AUTHORIZE: "50"
  RATE_LIMIT_FORGOT_PASSWORD: "30"
  ACCESS_TOKEN_TTL: "900"
  REFRESH_TOKEN_TTL: "1209600"
  SESSION_TTL: "2592000"
  EMAIL_PROVIDER: smtp
  SMTP_PORT: "1025"
  SMTP_FROM: no-reply@auth.local
  TRUST_PROXY: "true"

# Assembly: postgres://identity:$(POSTGRES_PASSWORD)@<fullname>-postgres:5432/identity
# When cloud-managed, set the full URL here (infrastructure.enabled: false).
databaseUrl: ""

# Leave empty to auto-generate on first install (stable across upgrades).
secrets:
  kmsMasterKey: ""
  gatewaySharedSecret: ""
  postgresPassword: ""

seeds:
  adminEmail: admin@auth.local
  # If empty, the seed generates a one-time password printed in job logs.
  adminPassword: ""

ingress:
  enabled: true
  className: nginx
  host: identity.local
  annotations: {}