name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Fast static gates: no services required ----
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (blocking)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ---- Integration tests against real Postgres + Redis ----
  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: change_me_dev_password
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity -d identity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://identity:change_me_dev_password@localhost:5432/identity
      REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Integration tests boot the real apps; they need a migrated,
      # seeded schema (roles/permissions must exist before registration).
      - name: Migrate & seed test database
        run: |
          npm run migrate
          npm run seed

      - name: Run tests with coverage
        run: npx jest --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ---- Prove the production image builds ----
  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test compiled entrypoints exist
        run: |
          docker build -t identity-platform:ci .
          docker run --rm --entrypoint node identity-platform:ci \
            -e "require('fs').accessSync('dist/apps/auth-server/main.js'); \
                require('fs').accessSync('dist/apps/api-gateway/main.js'); \
                require('fs').accessSync('dist/apps/resource-api/main.js'); \
                require('fs').accessSync('migrations'); \
                console.log('image artifacts OK')"
