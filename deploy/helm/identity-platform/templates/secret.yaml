{{- $secretName := include "identity-platform.credentials" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName).data | default dict }}

{{- $kms := $existing.KMS_MASTER_KEY }}
{{- if and (not $kms) .Values.secrets.kmsMasterKey }}
{{- $kms = .Values.secrets.kmsMasterKey }}
{{- end }}
{{- if not $kms }}
{{- $kms = randBytes 32 | b64enc }}
{{- end }}

{{- $gateway := $existing.GATEWAY_SHARED_SECRET }}
{{- if and (not $gateway) .Values.secrets.gatewaySharedSecret }}
{{- $gateway = .Values.secrets.gatewaySharedSecret }}
{{- end }}
{{- if not $gateway }}
{{- $gateway = randBytes 32 | b64enc }}
{{- end }}

{{- $postgresPassword := $existing.POSTGRES_PASSWORD }}
{{- if and (not $postgresPassword) .Values.secrets.postgresPassword }}
{{- $postgresPassword = .Values.secrets.postgresPassword | b64enc }}
{{- end }}
{{- if not $postgresPassword }}
{{- $postgresPassword = randAlphaNum 24 | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  KMS_MASTER_KEY: {{ $kms }}
  GATEWAY_SHARED_SECRET: {{ $gateway }}
  POSTGRES_PASSWORD: {{ $postgresPassword }}