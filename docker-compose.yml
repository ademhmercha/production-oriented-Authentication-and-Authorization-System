name: identity-platform

x-common-env: &common-env
  NODE_ENV: production
  LOG_LEVEL: info
  JWT_ISSUER: https://auth.local
  JWT_AUDIENCE: api
  KMS_KEY_DIR: /app/keys
  # REQUIRED: base64 32-byte master key wrapping signing keys at rest.
  # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
  KMS_MASTER_KEY: ${KMS_MASTER_KEY:?set KMS_MASTER_KEY in .env (see .env.example)}
  DATABASE_URL: postgres://identity:${POSTGRES_PASSWORD:-change_me_dev_password}@postgres:5432/identity
  REDIS_URL: redis://redis:6379
  AUTH_SERVER_URL: http://auth-server:3001
  RESOURCE_API_URL: http://resource-api:3002
  GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
  EMAIL_PROVIDER: smtp
  SMTP_HOST: mailhog
  SMTP_PORT: '1025'
  SMTP_FROM: no-reply@auth.local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_password}
      POSTGRES_DB: identity
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U identity -d identity']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '8025:8025' # web UI to inspect outgoing emails

  migrate:
    build: .
    command: ['node', 'dist/scripts/migrate.js']
    environment:
      <<: *common-env
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    build: .
    command: ['node', 'dist/scripts/seed.js']
    environment:
      <<: *common-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@auth.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  auth-server:
    build: .
    environment: *common-env
    ports:
      - '3001:3001'
    volumes:
      - keys:/app/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3001/health/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 6

  resource-api:
    build: .
    command: ['node', 'dist/apps/resource-api/main.js']
    environment: *common-env
    ports:
      - '3002:3002'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  api-gateway:
    build: .
    command: ['node', 'dist/apps/api-gateway/main.js']
    environment: *common-env
    ports:
      - '3000:3000'
    depends_on:
      auth-server:
        condition: service_healthy
      resource-api:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3000/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  redisdata:
  keys:
